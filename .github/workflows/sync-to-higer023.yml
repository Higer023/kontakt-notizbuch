
name: Automatic Sync to Higer023

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: automatic-sync-higer023
  cancel-in-progress: false

jobs:
  sync:
    name: Copy, verify and commit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: Higer23/kontakt-notizbuch
          ref: main
          path: source
          persist-credentials: false

      - name: Checkout target main
        uses: actions/checkout@v4
        with:
          repository: Higer023/kontakt-notizbuch
          ref: main
          token: ${{ secrets.SYNC_PR_TOKEN }}
          path: target
          persist-credentials: true

      - name: Validate repositories and token
        shell: bash
        run: |
          set -euo pipefail
          test -f source/README.md
          test -f source/.github/workflows/sync-to-higer023.yml
          test -d target/.git
          git -C source status --short
          git -C target status --short
          echo "Source and target check passed."

      - name: Copy source files
        shell: bash
        run: |
          set -euo pipefail

          # Do not copy Git metadata or overwrite target's own sync workflow.
          rsync -a --checksum \
            --exclude='.git/' \
            --exclude='.github/workflows/sync-to-higer023.yml' \
            source/ target/

      - name: Verify copied files
        shell: bash
        run: |
          set -euo pipefail
          diff -qr \
            --exclude='.git' \
            --exclude='sync-to-higer023.yml' \
            source target
          echo "Copied source files verified."

      - name: Commit and push to target main
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Higer23 Sync Bot"
          git config user.email "higer23-sync-bot@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Target is already synchronized."
            exit 0
          fi

          git commit -m "chore(sync): update from Higer23 main"

          # Never force-push. If main moved concurrently, fail safely.
          git push origin HEAD:main

          echo "Synchronization commit pushed successfully."

name: Automatic Sync to Higer023

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automatic-sync-higer023
  cancel-in-progress: false

jobs:
  sync-pr:
    name: Create/update target sync PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN }}
      TARGET: Higer023/kontakt-notizbuch
      SYNC_BRANCH: sync/higer23-main
    steps:
      - name: Checkout source main
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          persist-credentials: false

      - name: Validate token and target repository
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::SYNC_PR_TOKEN secret is missing or empty."
            exit 1
          fi
          gh api "repos/$TARGET" --jq .full_name
          gh api "repos/$TARGET/branches/main" --jq .name

      - name: Prepare target sync branch
        shell: bash
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/$TARGET.git" target
          cd target
          git config user.name "Higer23 Sync Bot"
          git config user.email "higer23-sync-bot@users.noreply.github.com"
          git fetch origin main
          git checkout -B "$SYNC_BRANCH" origin/main

          # Zielspezifische Workflows und stabile Snapshots unverändert beibehalten.
          # Keep target-specific workflows and stable snapshots intact.
          rsync -a --delete             --exclude='.git/'             --exclude='.github/'                          ../source/ ./

          git add -A
          if git diff --cached --quiet; then
            echo "No file differences to synchronize."
            echo "SYNC_CHANGED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          git commit -m "chore(sync): update from Higer23 main"
          git push --force-with-lease origin "$SYNC_BRANCH"
          echo "SYNC_CHANGED=true" >> "$GITHUB_ENV"

      - name: Open or update target pull request
        if: env.SYNC_CHANGED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Die Ziel-API direkt abfragen; gh pr list --head owner:branch kann
          # Query the target API directly; gh pr list --head owner:branch can
          # Eine vorhandene PR desselben Repositorys übersehen und anschließend beim doppelten Erstellen fehlschlagen.
          # miss an existing same-repository PR and then fail on duplicate create.
          PR_NUMBER=$(gh api "repos/$TARGET/pulls?state=open&base=main&per_page=100"             --jq ".[] | select(.head.ref == \"$SYNC_BRANCH\") | .number" | head -n 1)

          if [ -z "$PR_NUMBER" ]; then
            gh pr create --repo "$TARGET"               --base main               --head "$SYNC_BRANCH"               --title "Sync Higer23 main into Higer023 main"               --body "Automated synchronization from Higer23/main. Required target checks must pass before merge."
            PR_NUMBER=$(gh api "repos/$TARGET/pulls?state=open&base=main&per_page=100"               --jq ".[] | select(.head.ref == \"$SYNC_BRANCH\") | .number" | head -n 1)
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "::error::Could not find or create the sync pull request."
            exit 1
          fi
          echo "Sync PR: https://github.com/$TARGET/pull/$PR_NUMBER"
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          echo "SYNC_PR_URL=https://github.com/$TARGET/pull/$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Enable auto-merge after required checks pass
        if: env.SYNC_CHANGED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api --method PATCH "repos/$TARGET" -F allow_auto_merge=true >/dev/null; then
            echo "::warning::Could not enable repository auto-merge. The sync PR remains open and protected."
            echo "Auto-merge setting could not be changed; review/enable it in target repository settings." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if gh pr merge "$PR_NUMBER" --repo "$TARGET" --auto --squash; then
            echo "Auto-merge requested. GitHub will merge only after required checks pass."
            echo "Auto-merge requested for $SYNC_PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub refused to enable auto-merge. The sync PR remains open; branch protection was not bypassed."
            echo "Auto-merge could not be requested. Review $SYNC_PR_URL and target settings." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report no changes
        if: env.SYNC_CHANGED == 'false'
        run: echo "Source and target sync branch already match; nothing to do."

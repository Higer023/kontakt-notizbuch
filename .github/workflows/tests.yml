name: Testler (dagitim yok)

on:
  pull_request:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bagimliliklar (tests/)
        run: cd tests && npm install --no-audit --no-fund
      - name: Statik testler ve sozdizimi
        run: node tests/static.test.mjs
      - name: Davranissal testler (sahte D1)
        run: node tests/behavior.test.mjs

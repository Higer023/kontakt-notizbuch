name: Discord Sync and CI Status Report
on:
  workflow_run:
    workflows:
      - "Automatic Sync to Higer023"
      - "Quality Gate"
      - "Deploy"
      - "Automation failure report"
    types: [completed]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pull-requests: read
concurrency:
  group: discord-status-report-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send detailed report to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
          RUN_NAME: ${{ github.event.workflow_run.name || 'Manual Discord report test' }}
          RUN_STATUS: ${{ github.event.workflow_run.conclusion || 'manual_test' }}
          RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          ACTOR: ${{ github.event.workflow_run.actor.login || github.actor }}
          EVENT_TYPE: ${{ github.event.workflow_run.event || github.event_name }}
        run: |
          set -euo pipefail
          if [[ -z "${DISCORD_WEBHOOK_URL:-}" ]]; then
            echo "::error::Missing DISCORD_WEBHOOK_URL GitHub Actions secret."
            exit 1
          fi
          python - <<'PY'
          import json, os, subprocess, sys, urllib.request, urllib.error, datetime
          def gh(path):
              p = subprocess.run(["gh","api",path], text=True, capture_output=True, check=True,
                                 env={**os.environ,"GH_TOKEN":os.environ["GH_TOKEN"]})
              return json.loads(p.stdout)
          repo=os.environ["REPO"]; rid=os.environ["RUN_ID"]; status=os.environ["RUN_STATUS"]
          url=os.environ["RUN_URL"]; sha=os.environ["HEAD_SHA"]; branch=os.environ["HEAD_BRANCH"]
          name=os.environ["RUN_NAME"]; actor=os.environ["ACTOR"]; event=os.environ["EVENT_TYPE"]
          try:
              allruns=gh(f"repos/{repo}/actions/workflows/sync-to-higer023.yml/runs?per_page=100").get("workflow_runs",[])
              recent=[r for r in allruns if r.get("status")=="completed"][:30]
              passed=sum(r.get("conclusion")=="success" for r in recent)
              failed=sum(r.get("conclusion")=="failure" for r in recent)
              other=len(recent)-passed-failed
              rate=f"{passed/len(recent)*100:.1f}% ({passed}/{len(recent)})" if recent else "not enough data"
              recentlinks="\n".join(f"• [{r.get('name','Sync')} #{r.get('run_number','?')}]({r.get('html_url','#')}) — {r.get('conclusion','unknown')}" for r in recent[:5]) or "No completed sync runs found."
          except Exception:
              passed=failed=other=0; rate="unavailable"; recentlinks="History could not be retrieved."
          jobs=[]
          try:
              for j in gh(f"repos/{repo}/actions/runs/{rid}/jobs?per_page=100").get("jobs",[]):
                  steps="; ".join(f"{s.get('name','step')}: {s.get('conclusion') or s.get('status') or 'unknown'}" for s in j.get("steps",[]))
                  jobs.append(f"• **{j.get('name','Job')}** — {j.get('conclusion') or j.get('status','unknown')}\n  {steps[:650]}")
          except Exception:
              jobs=["Job/step details unavailable."]
          source=f"https://github.com/{repo}"; target="https://github.com/Higer023/kontakt-notizbuch"
          failedstatus=status in ("failure","cancelled","timed_out","action_required")
          color=15158332 if failedstatus else (3066993 if status=="success" else 15844367)
          title="🚨 Automation failed" if failedstatus else ("🧪 Manual webhook test" if os.environ["EVENT_NAME"]=="workflow_dispatch" else "📡 Automation status")
          description="\n".join([
              f"**Workflow:** {name}",f"**Result:** {status}",f"**Branch:** {branch}",
              f"**Commit:** [{sha[:12]}]({source}/commit/{sha})",f"**Actor:** {actor}",f"**Event:** {event}",
              f"**Run ID:** {rid}",f"**Sync success rate (latest up to 30 completed):** {rate}",
              f"**Counts:** {passed} passed · {failed} failed · {other} other",
              "**Jobs and steps**\n"+"\n".join(jobs),
              "**Recent sync runs**\n"+recentlinks,
              f"**Source:** {source}",f"**Target:** {target}",f"**This run:** {url}",
              f"**Source Actions:** {source}/actions",f"**Target Actions:** {target}/actions",
              "**Note:** The historical percentage is not a guarantee of future success."
          ])[:4000]
          payload={"username":"Higer Sync Monitor","allowed_mentions":{"parse":[]},"embeds":[{"title":title,"url":url,"description":description,"color":color,"footer":{"text":"kontakt-notizbuch · GitHub Actions monitor"},"timestamp":datetime.datetime.now(datetime.timezone.utc).isoformat()}]}
          req=urllib.request.Request(os.environ["DISCORD_WEBHOOK_URL"],data=json.dumps(payload).encode(),headers={"Content-Type":"application/json","User-Agent":"Higer-GitHub-Actions-Monitor"},method="POST")
          try:
              with urllib.request.urlopen(req,timeout=15) as res:
                  if res.status not in (200,204): raise RuntimeError(f"Discord HTTP {res.status}")
                  print(f"Discord notification sent: HTTP {res.status}")
          except urllib.error.HTTPError as e:
              print(f"Discord webhook failed: HTTP {e.code}",file=sys.stderr); raise
          PY

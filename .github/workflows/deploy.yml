name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Statik testler ve sozdizimi
        run: node tests/static.test.mjs
      - name: Bagimliliklar (tests/)
        run: cd tests && npm install --no-audit --no-fund
      - name: Davranissal testler (sahte D1)
        run: node tests/behavior.test.mjs
      - name: Istemci sifreleme regresyon testleri
        run: node tests/crypto.test.mjs
      - name: CSV formula injection regression tests
        run: node tests/csv.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: D1 semasini uygula (idempotent)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute kontakt-db --remote --file=schema.sql

      - name: Worker ve statik dosyalari deploy et
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
